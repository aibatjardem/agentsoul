name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    validate:
        name: Typecheck + test + plugin check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci


            - name: Typecheck
              run: npm run typecheck

            - name: Test (hook, build, validator)
              run: npm test

            - name: Validate sources and check the committed build is up to date
              run: npm run check
