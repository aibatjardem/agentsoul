name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    validate:
        name: Build + typecheck + soul validation
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Install pyyaml (required by check-soul.sh)
              run: pip3 install --break-system-packages pyyaml

            - name: Typecheck
              run: npm run typecheck

            - name: Build
              run: npm run build

            - name: Validate soul-kit consistency
              run: bash core/scripts/check-soul.sh

            - name: Dry-run npm publish (verify package structure)
              run: npm publish --dry-run --access public
