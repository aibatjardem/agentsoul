name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    validate:
        name: Build + typecheck + test + soul validation
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci


            - name: Typecheck
              run: npm run typecheck

            - name: Build
              run: npm run build

            - name: Test
              run: node --test test/*.test.mjs

            - name: Validate kit sources (core/)
              run: node dist/cli.js check --source

            - name: Validate dogfood install (repo's own .soul/ and .claude/)
              run: node dist/cli.js check

            - name: Dry-run npm publish (verify package structure)
              run: npm publish --dry-run --access public
