name: Publish to npm

on:
    push:
        tags:
            - "v*"

jobs:
    publish:
        name: Publish @samiyev/agentsoul
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # нужно для npm provenance

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"
                  registry-url: "https://registry.npmjs.org"

            - name: Install dependencies
              run: npm ci

            - name: Install pyyaml (required by check-soul.sh)
              run: pip3 install --break-system-packages pyyaml

            - name: Typecheck
              run: npm run typecheck

            - name: Build
              run: npm run build

            - name: Validate soul-kit consistency
              run: bash core/scripts/check-soul.sh

            - name: Verify tag matches package.json version
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  PKG=$(node -p "require('./package.json').version")
                  if [ "$TAG" != "$PKG" ]; then
                      echo "❌ Git tag v$TAG does not match package.json version $PKG"
                      exit 1
                  fi
                  echo "✅ tag v$TAG matches package.json version $PKG"

            - name: Publish to npm (with provenance)
              run: npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
